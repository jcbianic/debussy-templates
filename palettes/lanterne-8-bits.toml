# Lanterne 8 bits : la nuit de la lanterne en pixel art, indigo et or ; papier crème en clair.
# Données seulement (ADR 0093, D6) : aucun style ni CSS, les jetons composés sont ceux de la console.

name = "Lanterne 8 bits"

[light]
# Surfaces
ground = "#f4ecd6"
surface = "#fbf6e9"
sunk = "#eee6d2"
raised = "#fdfbf4"
docked = "#fdfbf4"
# Encres et lignes
ink = "#1a1c3a"
