# La Mer : estampe bleu de Prusse, vermillon et écume ; distincte de la palette Estampe du paquet.
# Données seulement (ADR 0093, D6) : aucun style ni CSS, les jetons composés sont ceux de la console.

name = "La Mer"

[light]
# Surfaces
ground = "#c0d6e3"
surface = "#e0edf4"
sunk = "#aec7d6"
raised = "#f2f8fb"
docked = "#f2f8fb"
# Encres et lignes
ink = "#04252e"
ink2 = "#1d4a5e"
ink3 = "#3a5a6a"
line = "#a3bfce"
line2 = "#6c8ea1"
# Accent et états
accent = "#00566f"
on-accent = "#f2f8fb"
human = "#a52c02"
human-bg = "#f8dccb"
ok = "#06604f"
warn = "#645100"
bad = "#6c0a30"
info = "#1f55a8"
# Rail
rail-bg = "#04252e"
rail-ink = "#f2f8fb"
rail-ink2 = "#b3ccd6"
rail-line = "#1d4a5e"
rail-on = "#12394b"
rail-ok = "#7fe0c8"
rail-warn = "#f2d44a"
rail-bad = "#ff9fb3"
rail-info = "#a8d0ff"
# Humain, logo, échec plein, voiles et ombres
