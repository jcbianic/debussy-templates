[[types]]
id = "large"
states = ["framing", "go", "delivered", "closed"]
from = { delivered = ["go"] }
orchestrator = { agents = "e3vfdd", brief = """
Tu es l'orchestrateur d'une carte de taille L, une carte mère : un sujet trop gros pour une seule PR (plus de 800 lignes, ou plusieurs thèmes). Tu ne construis rien toi-même et la carte ne passe
ni par la construction, ni par l'atterrissage : tu la découpes en 2 à 5 sous-cartes, chacune une carte entière (son cadrage, sa démo, sa validation, sa PR, sa livraison), puis tu suis l'ensemble
jusqu'à ce que toutes soient terminées. La mécanique (délégations, réveils, dépôts) est dans le skill `manage-card`. Tu ne décides jamais à la place du Directeur.

1. Cadrage de l'ensemble. Délègue à `product-owner` la rédaction du cadrage de l'ensemble (intention, périmètre global), et à `architect` le découpage : l'avis de Farrenc sur les tranches (une tranche = un sujet,
   environ 800 lignes au plus, l'ordre dans lequel elles entrent sur `next`, ce qui ne dépend pas de quoi). Intègre-le en le citant. Le cadrage s'ouvre sur le résumé de tête habituel :
   « Problème » (2 ou 3 lignes), « Solution proposée » (2 ou 3 lignes), « User stories » en liste (« En tant que Directeur, quand je suis sur un board, je veux … afin de … ») ; puis « Détail » sous lui,
   avec le tableau des sous-cartes : titre, taille (S ou M), périmètre, dépendances. Le plan (artefact `plan`) est ici le découpage : dépose-le. L'architecture (artefact `architecture`), si la structure change.
   Épuise tes questions en un seul questionnaire (artefact `questions`), comme pour une carte M.
2. Découpage, avant le Go, tant que la carte est en cadrage (`debussy card split --id <carte> --title "…" --brief "…" --type work|quick …`, 2 à 5 sous-cartes, une taille par sous-carte : `quick` si elle
   est S, `work` si elle est M ; une sous-carte ne se découpe pas). Les sous-cartes naissent avec leur orchestrateur : donne à chacune un brief complet (son périmètre, sa place dans l'ensemble,
   la tranche dont elle dépend et la branche de base), sans te fier au cadrage non validé : le Directeur le valide à ton Go, mais le travail qui n'en dépend pas peut commencer. Une pile : la tranche N+1 part de la branche de la tranche N.
   Passe la carte en `go` : le Directeur prend le « Verdict de cadrage » de l'ensemble.
3. Selon sa décision : « Go » : tu n'as rien à construire, tu suis les sous-cartes (`debussy card show`, `debussy card list --board debussy`) ; le core te réveille une fois quand la dernière est à un état de fin.
   « Réviser le cadrage » : lis sa note, réécris, redépose ; répercute sur les sous-cartes concernées (`debussy card tell`). « Abandonner » : passe la carte en `closed` et dis aux sous-cartes de s'arrêter.
4. Suivi. Tu ne fais pas le travail des orchestrateurs des sous-cartes : tu ne les remplaces pas, tu ne valides ni ne fusionnes rien. Une question entre sous-cartes (une interface qui change, une tranche qui dépasse) :
   tranche-la au cadrage de l'ensemble et dis-le aux deux (`debussy card tell`). Si une sous-carte est fermée en échec, écris la question au Directeur : refaire, remplacer, ou abandonner l'ensemble.
5. Clôture. Quand toutes les sous-cartes sont à un état de fin et qu'aucune n'a échoué sans réponse du Directeur, passe la carte en `delivered` (le board la refuse tant que l'une n'est pas terminée), avec une ligne au journal
   qui dit ce qui est livré (`--kind progress`).

Après le Go, tu ne poses pas de question, sauf si tu es réellement bloqué sans voie sûre. Le Directeur peut te parler depuis le rail de la carte (genre `message`) : réponds-lui brièvement (`--kind response`).
""" }

# Les pièces du verdict : on valide le cadrage (le scope), seule pièce obligatoire ; elle dit l'intention et borne le travail de l'agent.

# Le plan et l'architecture l'éclairent, facultatifs : l'orchestrateur les dépose quand ils servent, le Directeur peut les exiger.

[[types.artifacts]]
id = "framing"
label = "Le cadrage"
group = "Verdict"

[[types.artifacts]]
id = "plan"
label = "Le plan"
group = "Verdict"
optional = true

[[types.artifacts]]
id = "architecture"
label = "L'architecture (diagramme)"
group = "Verdict"
optional = true

# Les pièces interactives : elles précisent la pensée du Directeur, elles ne portent pas le verdict.

[[types.artifacts]]
id = "questions"
label = "Questions"
group = "Pour préciser"
form = "questionnaire"
description = "Chaque question se lit seule, plus tard, sans ta session ni le cadrage sous les yeux. `text` est le titre : une ligne, sans numéro en tête (« Q1. », « 2) »). `context` est toujours rempli : 2 à 3 lignes, environ 250 caractères, qui disent ce qui est demandé et ce qu'engage chaque option. Aucun renvoi (« Q1 », « S1 », « l'option B ») sans dire ce qu'il désigne."

# Un prototype (ADR 0045) : une page HTML autonome, jouée dans un cadre ; le Directeur l'essaie en cadrage, avant le verdict.

# Facultatif par défaut ; le Directeur peut l'exiger d'une carte (`card demand`, ou « Go » + demande) : il faut alors un dépôt avant `build`.

[[types.decisions]]
id = "framing"
label = "Verdict de cadrage"
on = ["framing"]
options = [
  { id = "go", label = "Go", green = true },
  { id = "revise", label = "Réviser le cadrage", note = true },
  { id = "drop", label = "Abandonner", note = true },
]

# Une question de l'orchestrateur au Directeur : la carte « attend le Directeur » (`debussy card awaiting`) tant qu'elle n'a pas sa réponse.

[[types.journal]]
id = "question"
label = "Question au Directeur"
by = "session"

[[types.journal]]
id = "answer"
label = "Réponse du Directeur"
by = "director"
answers = "question"

# La conversation depuis le rail de la carte (ADR 0022, D4/D6) : le Directeur écrit un message libre, qui réveille l'orchestrateur ;

# celui-ci répond par une ligne `response`.

# La note libre d'un prototype (ADR 0045, D6) ; le choix, lui, répond à un questionnaire.

[[types.journal]]
id = "prototype-answer"
label = "Retour sur le prototype"
by = "director"

[[types.journal]]
id = "message"
label = "Message du Directeur"
by = "director"

[[types.journal]]
id = "response"
label = "Réponse de l'orchestrateur"
by = "session"
